# Configuration file for Self-Balancing Robot

# Training Configuration
training:
  total_timesteps: 1000000
  n_envs: 4
  learning_rate: 0.0003
  batch_size: 64
  n_steps: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  save_freq: 10000
  eval_freq: 5000

# Environment Configuration
environment:
  max_steps: 1000
  max_motor_velocity: 20.0  # rad/s
  time_step: 0.00416667  # 1/240

# Reward Configuration
reward:
  upright_weight: 1.0
  velocity_penalty: 0.1
  time_penalty: 0.01
  fall_threshold: 0.785398  # pi/4 radians (45 degrees)

# Hardware Configuration (Raspberry Pi)
hardware:
  # Motor Controller Pins
  left_motor:
    pwm_pin: 12
    dir_pin1: 16
    dir_pin2: 18
  
  right_motor:
    pwm_pin: 13
    dir_pin1: 19
    dir_pin2: 21
  
  pwm_frequency: 1000  # Hz
  
  # IMU Configuration
  imu:
    i2c_bus: 1
    address: 0x68
    complementary_filter_alpha: 0.98
  
  # Control Loop
  control_frequency: 50  # Hz

# Model Export Configuration
export:
  onnx_opset_version: 11
